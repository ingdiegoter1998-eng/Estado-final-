<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista previa sello {{ sello.tipo }} — {{ sello.radicado }}</title>
    <style>
        :root {
            --ink: #14324f;
            --mute: #5d7388;
            --line: rgba(20, 50, 79, 0.14);
            --glass: rgba(255, 255, 255, 0.55);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem 1rem;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(900px 420px at 10% 0%, rgba(11, 79, 151, 0.18), transparent 55%),
                radial-gradient(700px 380px at 90% 100%, rgba(56, 189, 248, 0.16), transparent 50%),
                linear-gradient(165deg, #f4f8fc 0%, #e5eef8 100%);
        }
        .wrap {
            width: min(640px, 100%);
            display: grid;
            gap: 1rem;
        }
        .meta, .actions {
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 18px 40px -28px rgba(15, 40, 70, 0.35);
        }
        .meta { padding: 1rem 1.1rem; }
        .meta h1 { margin: 0 0 0.35rem; font-size: 1.15rem; }
        .meta p { margin: 0; color: var(--mute); font-size: 0.92rem; line-height: 1.45; }
        .stage {
            display: grid;
            place-items: center;
            padding: 1.25rem;
            border-radius: 18px;
            border: 1px dashed rgba(20, 50, 79, 0.2);
            background: rgba(255, 255, 255, 0.28);
        }

        /* --- Etiqueta 2" x 1" real (misma composición que el ZPL/PDF) --- */
        .label {
            width: 480px;
            max-width: 100%;
            aspect-ratio: 2 / 1;
            background: #fff;
            color: #000;
            border: 3px solid #000;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px -28px rgba(15, 40, 70, 0.45);
            font-family: "Arial Narrow", "Segoe UI", Arial, sans-serif;
        }
        .hospital-nombre {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .radicacion-titulo {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .rule { height: 2px; background: #000; width: 100%; margin: 6px 0; }
        .radicado {
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fila-texto {
            font-size: 0.82rem;
            font-weight: 750;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tipo-franja {
            margin-top: auto;
            background: #000;
            color: #fff;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            border-radius: 0 0 10px 10px;
            padding: 5px 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            padding: 0.85rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            font-weight: 750;
            font-size: 0.92rem;
        }
        .btn-primary { background: #0b4f97; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.75); color: #14324f; border: 1px solid var(--line); }
        .link-zpl {
            display: inline-flex;
            align-items: center;
            font-size: 0.78rem;
            color: var(--mute);
            text-decoration: underline;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="meta">
            <h1>Vista previa del sello {{ sello.tipo }}</h1>
        </div>

        <div class="stage">
            <div class="label">
                <div class="hospital-nombre">Hospital del Sarare E.S.E</div>
                <div class="radicacion-titulo">RADICACIÓN DE CORRESPONDENCIA</div>
                <div class="rule"></div>
                <div class="radicado">{{ sello.radicado }}</div>
                <div class="rule"></div>
                <div class="fila-texto">{{ sello.fecha }}</div>
                <div class="fila-texto">{{ sello.oficina }}</div>
                <div class="tipo-franja">{{ sello.tipo }}</div>
            </div>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="{{ url_descarga_pdf }}" target="_blank" rel="noopener">Descargar / Imprimir PDF</a>
            <a class="btn btn-secondary" href="{{ url_volver }}">Volver al detalle</a>
            <a class="link-zpl" href="{{ url_descarga_zpl }}">Descargar ZPL (avanzado)</a>
        </div>
    </div>
</body>
</html>
